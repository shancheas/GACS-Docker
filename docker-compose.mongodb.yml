version: "3.8"

services:
  mongodb:
    image: mongo:4.4
    container_name: genieacs-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-adminpassword}
      - MONGO_INITDB_DATABASE=genieacs
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - ./parameters:/parameters:ro
    networks:
      - genieacs-network
    healthcheck:
      test: ["CMD", "mongo", "-u", "${MONGO_ROOT_USER:-admin}", "-p", "${MONGO_ROOT_PASSWORD:-adminpassword}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongodb_data:
    driver: local

networks:
  genieacs-network:
    name: genieacs-network
    driver: bridge
